name: metervision_app
description: "MeterVision Field Officer App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera + image
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Connectivity for sync trigger
  connectivity_plus: ^6.0.5

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
